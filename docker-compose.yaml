services:
  codex:
    build:
      context: .
      dockerfile: Dockerfile
    image: codex-workstation:latest
    container_name: ${CODEX_CONTAINER_NAME:-codex-dev}
    restart: unless-stopped
    init: true
    tty: true
    stdin_open: true
    working_dir: /workspace

    # Explicit, but matches the default behavior of Codex anyway
    environment:
      CODEX_HOME: /root/.codex
      CODEX_BYOBU_SESSION: codex

    volumes:
      - ${WORKSPACE_DIR:-./}:/workspace
      - codex_state:/root/

volumes:
  codex_state:
