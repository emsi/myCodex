services:
  codex:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CODEX_VERSION: ${CODEX_VERSION:-latest}
    image: codex-workstation:latest
    container_name: ${CODEX_CONTAINER_NAME:-codex-dev}
    restart: unless-stopped
    init: true
    tty: true
    stdin_open: true
    working_dir: /workspace

    # Explicit, but matches the default behavior of Codex anyway
    environment:
      CODEX_HOME: /root/.codex
      CODEX_BYOBU_SESSION: codex

    healthcheck:
      test: ["CMD-SHELL", "byobu-tmux has-session -t \"$${CODEX_BYOBU_SESSION:-codex}\" >/dev/null 2>&1"]
      interval: 1s
      timeout: 3s
      retries: 30
      start_period: 1s

    volumes:
      - ${WORKSPACE_DIR:-./}:/workspace
      - codex_state:/root/

volumes:
  codex_state:
