services:
  codex:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CODEX_VERSION: ${CODEX_VERSION:-latest}
    image: ${MYCODEX_IMAGE_NAME:-ghcr.io/infrasecture/harness-workstation}:${MYCODEX_IMAGE_TAG:-latest}
    container_name: ${CODEX_CONTAINER_NAME:-codex-dev}
    restart: unless-stopped
    init: true
    tty: true
    stdin_open: true
    working_dir: ${MYCODEX_WORKDIR:-/workspace}

    environment:
      MYCODEX_HOST_UID: ${MYCODEX_HOST_UID:-1000}
      MYCODEX_HOST_GID: ${MYCODEX_HOST_GID:-1000}
      MYCODEX_HOST_USER: ${MYCODEX_HOST_USER:-codex}
      MYCODEX_HOST_GROUP: ${MYCODEX_HOST_GROUP:-codex}
      MYCODEX_HOST_GROUPS: ${MYCODEX_HOST_GROUPS:-1000:codex}
      MYCODEX_CONTAINER_HOME: ${MYCODEX_CONTAINER_HOME:-/home/codex}
      MYCODEX_WORKDIR: ${MYCODEX_WORKDIR:-/workspace}
      CODEX_HOME: ${MYCODEX_CODEX_HOME:-/home/codex/.codex}
      CODEX_BYOBU_SESSION: codex
      MYCODEX_ATTACH_HINT: "${MYCODEX_ATTACH_HINT:-<path_to_myCodex>/myCodex}"

    healthcheck:
      test: ["CMD-SHELL", "gosu \"$${MYCODEX_HOST_USER:-codex}\" env CODEX_HOME=\"$${CODEX_HOME:-/home/codex/.codex}\" byobu-tmux has-session -t \"$${CODEX_BYOBU_SESSION:-codex}\" >/dev/null 2>&1"]
      interval: 1s
      timeout: 3s
      retries: 30
      start_period: 1s

    volumes:
      - ${WORKSPACE_DIR:-./}:${MYCODEX_WORKDIR:-/workspace}
      - codex_state:${MYCODEX_CONTAINER_HOME:-/home/codex}

volumes:
  codex_state:
    name: ${MYCODEX_STATE_VOLUME_NAME:-codex_state}
    external: true
