name: Publish Codex Image

on:
  workflow_dispatch:
  repository_dispatch:
    types: [codex_version_released]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository_owner }}/mycodex
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Codex Version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(npm view @openai/codex version --silent | tr -d '[:space:]')"
          if [[ -z "${VERSION}" ]]; then
            echo "Failed to resolve @openai/codex version from npm"
            exit 1
          fi
          IMAGE="${REGISTRY}/${IMAGE_NAME,,}"
          echo "codex_version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "image=${IMAGE}" >> "${GITHUB_OUTPUT}"
          echo "Resolved Codex version: ${VERSION}"
          echo "Target image: ${IMAGE}"

      - name: Check Existing Version Tag
        id: check
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${{ steps.version.outputs.image }}"
          VERSION="${{ steps.version.outputs.codex_version }}"
          if docker manifest inspect "${IMAGE}:${VERSION}" >/dev/null 2>&1; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
            echo "Image tag already exists: ${IMAGE}:${VERSION}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
            echo "New version detected: ${IMAGE}:${VERSION}"
          fi

      - name: Build and Push Image
        if: steps.check.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            CODEX_VERSION=${{ steps.version.outputs.codex_version }}
          tags: |
            ${{ steps.version.outputs.image }}:latest
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.codex_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        shell: bash
        run: |
          IMAGE="${{ steps.version.outputs.image }}"
          VERSION="${{ steps.version.outputs.codex_version }}"
          if [[ "${{ steps.check.outputs.exists }}" == "true" ]]; then
            echo "No publish needed. ${IMAGE}:${VERSION} already exists."
          else
            echo "Published ${IMAGE}:${VERSION} and updated ${IMAGE}:latest."
          fi
