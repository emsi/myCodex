name: Publish Codex Image

on:
  workflow_dispatch:
    inputs:
      codex_version:
        description: Codex npm version (empty resolves the latest published version)
        required: false
        type: string
      image_revision:
        description: Workstation image revision or "auto"
        required: false
        default: auto
        type: string
  repository_dispatch:
    types: [codex_version_released]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      MYCODEX_IMAGE_NAME: ghcr.io/infrasecture/harness-workstation
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Codex Version
        id: version
        shell: bash
        env:
          REQUESTED_CODEX_VERSION: ${{ inputs.codex_version || github.event.client_payload.codex_version || '' }}
          REQUESTED_IMAGE_REVISION: ${{ inputs.image_revision || github.event.client_payload.image_revision || 'auto' }}
        run: |
          set -euo pipefail
          source bin/lib/mycodex-image.sh
          VERSION="${REQUESTED_CODEX_VERSION}"
          if [[ -z "${VERSION}" ]]; then
            VERSION="$(mycodex_resolve_latest_codex_version)"
          fi
          REVISION="${REQUESTED_IMAGE_REVISION}"
          mycodex_validate_codex_version "${VERSION}"
          if [[ "${REVISION}" != "auto" ]]; then
            mycodex_validate_image_revision "${REVISION}"
          fi
          IMAGE="${MYCODEX_IMAGE_NAME}"
          echo "codex_version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "image_revision=${REVISION}" >> "${GITHUB_OUTPUT}"
          echo "image=${IMAGE}" >> "${GITHUB_OUTPUT}"
          echo "Resolved Codex version: ${VERSION}"
          echo "Requested workstation image revision: ${REVISION}"
          echo "Target image: ${IMAGE}"

      - name: Build and Push Images
        shell: bash
        run: |
          set -euo pipefail
          ./bin/build-codex-image.sh \
            --version "${{ steps.version.outputs.codex_version }}" \
            --revision "${{ steps.version.outputs.image_revision }}" \
            --release \
            --push

      - name: Summary
        shell: bash
        run: |
          IMAGE="${{ steps.version.outputs.image }}"
          VERSION="${{ steps.version.outputs.codex_version }}"
          echo "Publication command completed for ${IMAGE}, Codex ${VERSION}."
          echo "See the build output for the selected immutable revision and alias status."
