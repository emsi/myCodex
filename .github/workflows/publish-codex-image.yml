name: Publish Codex Image

on:
  workflow_dispatch:
  repository_dispatch:
    types: [codex_version_released]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      MYCODEX_IMAGE_NAME: ghcr.io/infrasecture/harness-workstation
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Codex Version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          source bin/lib/mycodex-image.sh
          VERSION="$(mycodex_resolve_latest_codex_version)"
          IMAGE="${MYCODEX_IMAGE_NAME}"
          echo "codex_version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "image=${IMAGE}" >> "${GITHUB_OUTPUT}"
          echo "Resolved Codex version: ${VERSION}"
          echo "Target image: ${IMAGE}"

      - name: Check Existing Version Tag
        id: check
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${{ steps.version.outputs.image }}"
          VERSION="${{ steps.version.outputs.codex_version }}"
          if docker manifest inspect "${IMAGE}:${VERSION}" >/dev/null 2>&1; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
            echo "Image tag already exists: ${IMAGE}:${VERSION}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
            echo "New version detected: ${IMAGE}:${VERSION}"
          fi

      - name: Build and Push Images
        if: steps.check.outputs.exists == 'false'
        shell: bash
        run: |
          set -euo pipefail
          ./bin/build-codex-image.sh \
            --version "${{ steps.version.outputs.codex_version }}" \
            --release \
            --push

      - name: Summary
        shell: bash
        run: |
          IMAGE="${{ steps.version.outputs.image }}"
          VERSION="${{ steps.version.outputs.codex_version }}"
          if [[ "${{ steps.check.outputs.exists }}" == "true" ]]; then
            echo "No publish needed. ${IMAGE}:${VERSION} already exists."
          else
            echo "Published ${IMAGE}:${VERSION}-amd64 and ${IMAGE}:${VERSION}-arm64."
            echo "Updated manifest tags ${IMAGE}:${VERSION} and ${IMAGE}:latest."
          fi
